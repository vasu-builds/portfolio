<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verdure Spa & Salon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #080f0a;
      --bg2:      #0f1a11;
      --bg3:      #162018;
      --bg4:      #1c2a1e;
      --green:    #2d6a4f;
      --green2:   #40916c;
      --green3:   #52b788;
      --green-l:  rgba(64,145,108,0.15);
      --gold:     #d4a847;
      --gold2:    #f0cc7a;
      --gold-d:   #8a6c20;
      --gold-l:   rgba(212,168,71,0.12);
      --white:    #f0ede6;
      --white2:   #d8d4ca;
      --muted:    #7a8c7e;
      --muted2:   #4a5e4e;
      --border:   rgba(212,168,71,0.14);
      --border2:  rgba(240,237,230,0.07);
      --font-d:   'Playfair Display', Georgia, serif;
      --font-b:   'Outfit', sans-serif;
      --ease:     cubic-bezier(0.22,1,0.36,1);
      --r:        12px;
      --r-lg:     20px;
    }
    html,body,#root { height:100%; }
    body { font-family:var(--font-b); background:var(--bg); color:var(--white); line-height:1.65; overflow-x:hidden; }
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:var(--bg2); }
    ::-webkit-scrollbar-thumb { background:var(--green); border-radius:99px; }
    button { font-family:var(--font-b); cursor:pointer; border:none; outline:none; }
    input,select,textarea { font-family:var(--font-b); outline:none; }

    /* Responsive admin sidebar */
    @media (max-width: 900px) {
      .admin-layout { flex-direction: column !important; }
      .admin-sidebar {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        width: 80vw;
        max-width: 320px;
        z-index: 2000;
        transform: translateX(-100%);
        transition: transform 0.3s var(--ease);
        box-shadow: 2px 0 24px rgba(0,0,0,0.18);
        height: 100vh;
        background: var(--bg2);
        border-right: 1px solid var(--border2);
        display: flex;
      }
      .admin-sidebar.open {
        transform: translateX(0);
      }
      .admin-sidebar-backdrop {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(8,15,10,0.45);
        z-index: 1999;
      }
      .admin-hamburger {
        display: flex !important;
      }
      .admin-main {
        padding: 1.2rem 2vw !important;
      }
    }
    @media (max-width: 900px) {
      .admin-sidebar { padding-top: 4.2rem !important; }
    }
    @media (max-width: 600px) {
      .admin-main { padding: 1.2rem 2vw !important; }
    }
    @media (max-width: 900px) {
      .admin-sidebar { width: 90vw; max-width: 340px; }
    }
    @media (min-width: 901px) {
      .admin-hamburger { display: none !important; }
      .admin-sidebar { position: static !important; transform: none !important; width: 220px !important; max-width: none !important; height: auto !important; box-shadow: none !important; padding-top: 1.4rem !important; }
      .admin-sidebar-backdrop { display: none !important; }
      .admin-layout { flex-direction: row !important; }
    }
    .admin-hamburger {
      position: absolute;
      top: 1.2rem;
      left: 1.2rem;
      z-index: 2100;
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 8px;
      width: 44px;
      height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 0;
      gap: 5px;
    }
    .admin-hamburger span {
      display: block;
      width: 24px;
      height: 3px;
      background: var(--green3);
      border-radius: 2px;
      margin: 0;
      transition: all 0.2s;
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── DATA ── */
const SERVICES = [
  { id:1,  cat:'Hair',   name:'Haircut & Style',    duration:45,  price:699,  icon:'✂', desc:'Precision cut tailored to your face shape and style.' },
  { id:2,  cat:'Hair',   name:'Hair Colour',         duration:120, price:2499, icon:'◈', desc:'Full colour, highlights, balayage or ombre by expert colourists.' },
  { id:3,  cat:'Hair',   name:'Botanical Hair Spa',  duration:60,  price:1299, icon:'◉', desc:'Deep conditioning ritual with plant-based oils for lustrous hair.' },
  { id:4,  cat:'Beard',  name:'Beard Trim & Shape',  duration:30,  price:399,  icon:'◎', desc:'Expert sculpting and hot towel finish.' },
  { id:5,  cat:'Beard',  name:'Luxury Hot Shave',    duration:45,  price:599,  icon:'◆', desc:'Classic straight razor shave with warm oils and cold compress.' },
  { id:6,  cat:'Skin',   name:'Herbal Facial',       duration:60,  price:1499, icon:'◇', desc:'Deep cleanse, exfoliation and botanical hydrating mask.' },
  { id:7,  cat:'Skin',   name:'Gold Ritual Facial',  duration:75,  price:2999, icon:'✦', desc:'24K gold-infused luxury facial for radiance and anti-aging.' },
  { id:8,  cat:'Spa',    name:'Scalp Ritual',        duration:30,  price:499,  icon:'▲', desc:'Relaxing scalp and neck massage with warm botanical oils.' },
  { id:9,  cat:'Spa',    name:'Full Body Massage',   duration:90,  price:2499, icon:'◐', desc:'Swedish or deep tissue massage for total restoration.' },
  { id:10, cat:'Waxing', name:'Full Body Wax',       duration:60,  price:1799, icon:'◑', desc:'Smooth, long-lasting wax with soothing after-care balm.' },
  { id:11, cat:'Waxing', name:'Face Wax',            duration:20,  price:399,  icon:'○', desc:'Precise facial hair removal with minimal discomfort.' },
  { id:12, cat:'Makeup', name:'Party Makeup',        duration:90,  price:3499, icon:'❋', desc:'Glamorous makeup for weddings, parties and special occasions.' },
];

const SLOTS = ['10:00 AM','10:30 AM','11:00 AM','11:30 AM','12:00 PM','12:30 PM','02:00 PM','02:30 PM','03:00 PM','03:30 PM','04:00 PM','04:30 PM','05:00 PM','05:30 PM','06:00 PM','06:30 PM'];
const CATS  = ['All',...[...new Set(SERVICES.map(s=>s.cat))]];

const SEED = [
  { id:1, name:'Ananya Sharma', phone:'9876543210', service:'Gold Ritual Facial',  date:'2024-11-20', slot:'02:00 PM', status:'Confirmed', price:2999 },
  { id:2, name:'Rahul Mehta',   phone:'9812345678', service:'Luxury Hot Shave',    date:'2024-11-20', slot:'11:00 AM', status:'Confirmed', price:599  },
  { id:3, name:'Priya Nair',    phone:'9900112233', service:'Hair Colour',          date:'2024-11-21', slot:'10:00 AM', status:'Pending',   price:2499 },
  { id:4, name:'Karan Singh',   phone:'9988776655', service:'Full Body Massage',   date:'2024-11-21', slot:'03:00 PM', status:'Confirmed', price:2499 },
  { id:5, name:'Meera Joshi',   phone:'9123456789', service:'Party Makeup',        date:'2024-11-22', slot:'10:00 AM', status:'Pending',   price:3499 },
  { id:6, name:'Dev Kapoor',    phone:'9654321098', service:'Haircut & Style',     date:'2024-11-19', slot:'04:00 PM', status:'Completed', price:699  },
];

const fmt  = n => '₹' + Number(n).toLocaleString('en-IN');
const getDays = () => {
  const days = [];
  for(let i=0;i<14;i++){
    const d = new Date(); d.setDate(d.getDate()+i);
    days.push({ date:d.toISOString().split('T')[0], label:d.toLocaleDateString('en-IN',{weekday:'short'}), num:d.getDate(), month:d.toLocaleDateString('en-IN',{month:'short'}) });
  }
  return days;
};

/* ── BADGE ── */
const Badge = ({status}) => {
  const map = {
    Confirmed:{ bg:'rgba(64,145,108,0.2)',  c:'#52b788' },
    Pending:  { bg:'rgba(212,168,71,0.18)', c:'var(--gold2)' },
    Completed:{ bg:'rgba(240,237,230,0.08)',c:'var(--muted)' },
    Cancelled:{ bg:'rgba(180,60,60,0.15)',  c:'#d47a7a' },
  };
  const s = map[status]||map.Pending;
  return <span style={{background:s.bg,color:s.c,fontSize:'0.68rem',fontWeight:600,padding:'3px 10px',borderRadius:99,letterSpacing:'0.05em'}}>{status}</span>;
};

/* ── TOAST ── */
const Toast = ({msg,type}) => (
  <div style={{position:'fixed',bottom:'2rem',left:'50%',transform:'translateX(-50%)',
    background:type==='error'?'rgba(100,20,20,0.95)':'rgba(15,40,20,0.95)',
    border:`1px solid ${type==='error'?'#9b4444':'var(--green2)'}`,
    color:type==='error'?'#e89090':'#80d4a8',
    padding:'0.75rem 1.6rem',borderRadius:99,fontSize:'0.82rem',fontWeight:500,
    zIndex:3000,whiteSpace:'nowrap',boxShadow:'0 8px 32px rgba(0,0,0,0.5)'}}>
    {type==='error'?'✕  ':'✓  '}{msg}
  </div>
);

/* ── SHARED STYLES ── */
const S = {
  card:      { background:'var(--bg2)', border:'1px solid var(--border2)', borderRadius:'var(--r)', padding:'1.4rem' },
  goldBtn:   { background:'linear-gradient(135deg,var(--gold-d),var(--gold))', color:'#1a1000', padding:'0.85rem 2rem', borderRadius:99, fontSize:'0.85rem', fontWeight:700, letterSpacing:'0.02em', border:'none', cursor:'pointer' },
  greenBtn:  { background:'linear-gradient(135deg,var(--green),var(--green2))', color:'#e8f5ee', padding:'0.85rem 2rem', borderRadius:99, fontSize:'0.85rem', fontWeight:600, border:'none', cursor:'pointer' },
  outlineBtn:{ background:'transparent', color:'var(--muted)', border:'1px solid var(--border2)', padding:'0.85rem 1.6rem', borderRadius:99, fontSize:'0.82rem', fontWeight:500, cursor:'pointer' },
  input:     { width:'100%', padding:'0.75rem 1rem', borderRadius:10, border:'1px solid var(--border2)', background:'var(--bg3)', color:'var(--white)', fontSize:'0.875rem', fontFamily:'var(--font-b)' },
  label:     { display:'block', fontSize:'0.68rem', fontWeight:600, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--muted)', marginBottom:'0.4rem' },
};

/* ════════════════════════════════
   MAIN APP — all useState at top
════════════════════════════════ */
const App = () => {
  /* navigation */
  const [screen, setScreen]       = useState('home');

  /* booking */
  const [step, setStep]           = useState(1);
  const [selCat, setSelCat]       = useState('All');
  const [selSvc, setSelSvc]       = useState(null);
  const [selDate, setSelDate]     = useState('');
  const [selSlot, setSelSlot]     = useState('');
  const [form, setForm]           = useState({name:'',phone:'',email:''});

  /* admin */
  const [adminPin, setAdminPin]   = useState('');
  const [adminAuth, setAdminAuth] = useState(false);
  const [adminFilter, setAdminFilter] = useState('All');
  const [adminView, setAdminView]     = useState('bookings');

  /* data */
  const [bookings, setBookings]   = useState(SEED);

  /* ui */
  const [toast, setToast]         = useState(null);
  // Sidebar open state for admin panel (must be at top level)
  const [sidebarOpen, setSidebarOpen] = useState(false);

  const days = getDays();

  const showToast = (msg, type='success') => {
    setToast({msg,type});
    setTimeout(()=>setToast(null), 3000);
  };

  const resetBook = () => {
    setSelSvc(null); setSelDate(''); setSelSlot('');
    setForm({name:'',phone:'',email:''});
    setStep(1); setScreen('home');
  };

  const confirmBooking = () => {
    if(!form.name||!form.phone){ showToast('Please fill in your name and phone','error'); return; }
    const nb = { id:Date.now(), name:form.name, phone:form.phone, email:form.email, service:selSvc.name, date:selDate, slot:selSlot, status:'Pending', price:selSvc.price };
    setBookings(b=>[nb,...b]);
    setScreen('confirm');
    showToast('Booking confirmed!');
  };

  const cancelBooking = id => { setBookings(b=>b.map(bk=>bk.id===id?{...bk,status:'Cancelled'}:bk)); showToast('Booking cancelled','error'); };
  const confirmBk     = id => { setBookings(b=>b.map(bk=>bk.id===id?{...bk,status:'Confirmed'}:bk)); showToast('Booking confirmed'); };
  const completeBk    = id => { setBookings(b=>b.map(bk=>bk.id===id?{...bk,status:'Completed'}:bk)); showToast('Marked as completed'); };

  const takenSlots    = bookings.filter(b=>b.date===selDate&&b.status!=='Cancelled').map(b=>b.slot);
  const filteredSvc   = selCat==='All' ? SERVICES : SERVICES.filter(s=>s.cat===selCat);
  const adminFiltered = adminFilter==='All' ? bookings : bookings.filter(b=>b.status===adminFilter);
  const stats = {
    total:     bookings.length,
    confirmed: bookings.filter(b=>b.status==='Confirmed').length,
    pending:   bookings.filter(b=>b.status==='Pending').length,
    revenue:   bookings.filter(b=>b.status==='Completed'||b.status==='Confirmed').reduce((a,b)=>a+b.price,0),
  };

  /* ── NAV ── */
  const Nav = ({showBack=false}) => (
    <nav style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'1.1rem 5%',borderBottom:'1px solid var(--border2)',background:'rgba(8,15,10,0.94)',backdropFilter:'blur(16px)',position:'sticky',top:0,zIndex:100}}>
      <div style={{fontFamily:'var(--font-d)',fontSize:'1.45rem',fontWeight:400,letterSpacing:'0.06em'}}>
        <span style={{color:'var(--green3)'}}>Verdure</span>
        <em style={{color:'var(--gold)',fontWeight:400,marginLeft:6}}>Spa</em>
      </div>
      <div style={{display:'flex',gap:'0.75rem'}}>
        {showBack
          ? <button onClick={resetBook} style={{...S.outlineBtn,padding:'0.5rem 1rem',fontSize:'0.75rem'}}>← Back</button>
          : <>
              <button onClick={()=>{setAdminAuth(false);setAdminPin('');setScreen('admin')}} style={{...S.outlineBtn,padding:'0.5rem 1rem',fontSize:'0.75rem'}}>Admin</button>
              <button onClick={()=>{setStep(1);setScreen('book')}} style={{...S.greenBtn,padding:'0.6rem 1.4rem',fontSize:'0.8rem',boxShadow:'0 4px 16px rgba(64,145,108,0.3)'}}>Book Now</button>
            </>
        }
      </div>
    </nav>
  );

  /* ════ HOME ════ */
  if(screen==='home') return (
    <div style={{minHeight:'100vh',background:'var(--bg)'}}>
      <Nav/>

      {/* HERO */}
      <div style={{position:'relative',overflow:'hidden',padding:'6rem 5% 5rem',minHeight:'88vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',textAlign:'center'}}>
        <div style={{position:'absolute',inset:0,background:'radial-gradient(ellipse 90% 70% at 50% 45%, rgba(64,145,108,0.07) 0%, transparent 65%)',pointerEvents:'none'}}></div>
        <svg style={{position:'absolute',top:'8%',right:'4%',opacity:0.05}} width="320" height="320" viewBox="0 0 320 320">
          <circle cx="160" cy="160" r="150" stroke="#40916c" strokeWidth="1" fill="none"/>
          <circle cx="160" cy="160" r="100" stroke="#d4a847" strokeWidth="1" fill="none"/>
          <circle cx="160" cy="160" r="50"  stroke="#40916c" strokeWidth="1" fill="none"/>
        </svg>
        <svg style={{position:'absolute',bottom:'8%',left:'3%',opacity:0.04}} width="220" height="220" viewBox="0 0 220 220">
          <circle cx="110" cy="110" r="100" stroke="#d4a847" strokeWidth="1" fill="none"/>
        </svg>
        <div style={{position:'relative',zIndex:1}}>
          <div style={{fontSize:'0.7rem',fontWeight:600,letterSpacing:'0.22em',textTransform:'uppercase',color:'var(--green3)',marginBottom:'1.5rem',opacity:0.9}}>— Luxury Spa & Salon —</div>
          <h1 style={{fontFamily:'var(--font-d)',fontSize:'clamp(2.8rem,7vw,6rem)',fontWeight:400,lineHeight:1.08,letterSpacing:'-0.01em',color:'var(--white)',marginBottom:'1.4rem'}}>
            Restore.<br/><em style={{color:'var(--gold)'}}>Renew. Radiate.</em>
          </h1>
          <p style={{fontSize:'1rem',fontWeight:300,color:'var(--muted)',maxWidth:420,margin:'0 auto 3rem',lineHeight:1.8}}>
            Premium grooming and wellness rituals for the discerning individual.
          </p>
          <div style={{display:'flex',gap:'1rem',justifyContent:'center',flexWrap:'wrap'}}>
            <button onClick={()=>{setStep(1);setScreen('book')}} style={{...S.greenBtn,padding:'1rem 2.6rem',fontSize:'0.9rem',boxShadow:'0 8px 28px rgba(64,145,108,0.28)'}}>
              Reserve Your Session →
            </button>
            <button onClick={()=>{setStep(1);setScreen('book')}} style={{...S.outlineBtn,padding:'1rem 2rem',fontSize:'0.9rem'}}>
              View All Services
            </button>
          </div>
        </div>
      </div>

      {/* SERVICES GRID */}
      <div style={{padding:'4rem 5%',borderTop:'1px solid var(--border2)'}}>
        <div style={{textAlign:'center',marginBottom:'3rem'}}>
          <div style={{fontSize:'0.68rem',letterSpacing:'0.18em',textTransform:'uppercase',color:'var(--green3)',marginBottom:'0.8rem'}}>Our Rituals</div>
          <h2 style={{fontFamily:'var(--font-d)',fontSize:'clamp(1.8rem,4vw,2.8rem)',fontWeight:400,color:'var(--white)'}}>
            Curated for <em style={{color:'var(--gold)'}}>Wellbeing</em>
          </h2>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))',gap:'1px',background:'var(--border2)',borderRadius:'var(--r-lg)',overflow:'hidden',border:'1px solid var(--border2)'}}>
          {SERVICES.slice(0,6).map(s=>(
            <div key={s.id} onClick={()=>{setSelSvc(s);setStep(2);setScreen('book')}}
              style={{background:'var(--bg2)',padding:'1.8rem',cursor:'pointer',transition:'background 0.2s'}}
              onMouseEnter={e=>e.currentTarget.style.background='var(--bg3)'}
              onMouseLeave={e=>e.currentTarget.style.background='var(--bg2)'}>
              <div style={{fontSize:'1.2rem',marginBottom:'0.9rem',color:'var(--green3)'}}>{s.icon}</div>
              <div style={{fontSize:'0.62rem',fontWeight:600,letterSpacing:'0.12em',textTransform:'uppercase',color:'var(--muted)',marginBottom:'0.35rem'}}>{s.cat}</div>
              <h3 style={{fontFamily:'var(--font-d)',fontSize:'1.1rem',fontWeight:400,color:'var(--white)',marginBottom:'0.4rem'}}>{s.name}</h3>
              <p style={{fontSize:'0.78rem',fontWeight:300,color:'var(--muted)',lineHeight:1.65,marginBottom:'1rem'}}>{s.desc}</p>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <span style={{fontFamily:'var(--font-d)',fontSize:'1.1rem',color:'var(--gold)',fontWeight:400}}>{fmt(s.price)}</span>
                <span style={{fontSize:'0.72rem',color:'var(--muted2)',background:'var(--bg3)',padding:'3px 8px',borderRadius:99}}>{s.duration} min</span>
              </div>
            </div>
          ))}
        </div>
        <div style={{textAlign:'center',marginTop:'1.8rem'}}>
          <button onClick={()=>{setStep(1);setScreen('book')}} style={{...S.outlineBtn,borderColor:'var(--green)',color:'var(--green3)'}}>
            View all {SERVICES.length} services →
          </button>
        </div>
      </div>

      {/* FOOTER */}
      <div style={{borderTop:'1px solid var(--border2)',padding:'1.8rem 5%',display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:'1rem'}}>
        <div style={{fontFamily:'var(--font-d)',fontSize:'1.1rem',color:'var(--green3)',fontStyle:'italic'}}>Verdure Spa</div>
        <div style={{fontSize:'0.78rem',color:'var(--muted)',fontWeight:300}}>Mon – Sun &nbsp;·&nbsp; 10 AM – 7 PM &nbsp;·&nbsp; +91 98765 43210</div>
      </div>
      {toast && <Toast msg={toast.msg} type={toast.type}/>}
    </div>
  );

  /* ════ BOOKING FLOW ════ */
  if(screen==='book') return (
    <div style={{minHeight:'100vh',background:'var(--bg)'}}>
      <Nav showBack/>

      {/* step indicator */}
      <div style={{padding:'2rem 5% 0',maxWidth:700}}>
        <div style={{display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'2rem'}}>
          {[{n:1,l:'Service'},{n:2,l:'Date & Time'},{n:3,l:'Your Details'}].map((s,i)=>(
            <React.Fragment key={s.n}>
              <div style={{display:'flex',alignItems:'center',gap:'0.5rem',opacity:step>=s.n?1:0.3}}>
                <div style={{width:28,height:28,borderRadius:'50%',
                  background:step===s.n?'var(--green2)':step>s.n?'var(--green3)':'var(--bg3)',
                  border:`1px solid ${step>=s.n?'var(--green2)':'var(--border2)'}`,
                  display:'flex',alignItems:'center',justifyContent:'center',
                  fontSize:'0.72rem',fontWeight:700,color:step>=s.n?'#0a1f10':'var(--muted)'}}>
                  {step>s.n?'✓':s.n}
                </div>
                <span style={{fontSize:'0.8rem',fontWeight:500,color:step===s.n?'var(--white)':'var(--muted)'}}>{s.l}</span>
              </div>
              {i<2 && <div style={{flex:1,height:1,background:step>s.n?'var(--green)':'var(--border2)',maxWidth:80}}></div>}
            </React.Fragment>
          ))}
        </div>
      </div>

      <div style={{padding:'0 5% 4rem',maxWidth:960,margin:'0 auto'}}>

        {/* STEP 1 */}
        {step===1 && (
          <div>
            <h2 style={{fontFamily:'var(--font-d)',fontSize:'2rem',fontWeight:400,color:'var(--white)',marginBottom:'0.4rem'}}>Choose a <em style={{color:'var(--gold)'}}>Ritual</em></h2>
            <p style={{fontSize:'0.85rem',color:'var(--muted)',fontWeight:300,marginBottom:'2rem'}}>Select the service you'd like to book.</p>
            <div style={{display:'flex',gap:'0.5rem',flexWrap:'wrap',marginBottom:'1.8rem'}}>
              {CATS.map(c=>(
                <button key={c} onClick={()=>setSelCat(c)}
                  style={{padding:'0.4rem 1rem',borderRadius:99,
                    border:`1px solid ${selCat===c?'var(--green2)':'var(--border2)'}`,
                    background:selCat===c?'var(--green-l)':'transparent',
                    color:selCat===c?'var(--green3)':'var(--muted)',
                    fontSize:'0.78rem',fontWeight:500}}>
                  {c}
                </button>
              ))}
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:'1rem'}}>
              {filteredSvc.map(s=>(
                <div key={s.id} onClick={()=>{setSelSvc(s);setStep(2)}}
                  style={{...S.card,cursor:'pointer',
                    border:`1px solid ${selSvc?.id===s.id?'var(--green2)':'var(--border2)'}`,
                    background:selSvc?.id===s.id?'var(--green-l)':'var(--bg2)',
                    transition:'all 0.2s'}}
                  onMouseEnter={e=>{e.currentTarget.style.background='var(--bg3)';e.currentTarget.style.borderColor='var(--green)';}}
                  onMouseLeave={e=>{e.currentTarget.style.background=selSvc?.id===s.id?'var(--green-l)':'var(--bg2)';e.currentTarget.style.borderColor=selSvc?.id===s.id?'var(--green2)':'var(--border2)';}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'0.9rem'}}>
                    <span style={{fontSize:'1.1rem',color:'var(--green3)'}}>{s.icon}</span>
                    <span style={{fontSize:'0.68rem',color:'var(--muted)',background:'var(--bg3)',padding:'3px 8px',borderRadius:99}}>{s.duration} min</span>
                  </div>
                  <div style={{fontSize:'0.62rem',letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:'0.3rem'}}>{s.cat}</div>
                  <h3 style={{fontFamily:'var(--font-d)',fontSize:'1.05rem',fontWeight:400,color:'var(--white)',marginBottom:'0.4rem'}}>{s.name}</h3>
                  <p style={{fontSize:'0.78rem',color:'var(--muted)',fontWeight:300,lineHeight:1.65,marginBottom:'0.9rem'}}>{s.desc}</p>
                  <div style={{fontFamily:'var(--font-d)',fontSize:'1.1rem',color:'var(--gold)',fontWeight:400}}>{fmt(s.price)}</div>
                </div>
              ))}
            </div>
            {selSvc && (
              <div style={{marginTop:'2rem',display:'flex',justifyContent:'flex-end'}}>
                <button onClick={()=>setStep(2)} style={S.greenBtn}>Continue with {selSvc.name} →</button>
              </div>
            )}
          </div>
        )}

        {/* STEP 2 */}
        {step===2 && (
          <div>
            <h2 style={{fontFamily:'var(--font-d)',fontSize:'2rem',fontWeight:400,color:'var(--white)',marginBottom:'0.4rem'}}>Pick a <em style={{color:'var(--gold)'}}>Date & Time</em></h2>
            <p style={{fontSize:'0.85rem',color:'var(--muted)',fontWeight:300,marginBottom:'2rem'}}>
              For: <span style={{color:'var(--green3)'}}>{selSvc?.name}</span>
            </p>

            <div style={{fontSize:'0.68rem',fontWeight:600,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:'1rem'}}>Select Date</div>
            <div style={{display:'flex',gap:'0.5rem',overflowX:'auto',paddingBottom:'0.6rem',marginBottom:'2rem'}}>
              {days.map(d=>(
                <button key={d.date} onClick={()=>{setSelDate(d.date);setSelSlot('');}}
                  style={{flexShrink:0,width:64,padding:'0.75rem 0',borderRadius:10,
                    border:`1px solid ${selDate===d.date?'var(--green2)':'var(--border2)'}`,
                    background:selDate===d.date?'var(--green-l)':'var(--bg2)',
                    color:selDate===d.date?'var(--green3)':'var(--muted)',textAlign:'center',cursor:'pointer'}}>
                  <div style={{fontSize:'0.6rem',letterSpacing:'0.06em',marginBottom:'0.2rem'}}>{d.label}</div>
                  <div style={{fontFamily:'var(--font-d)',fontSize:'1.3rem',fontWeight:400,lineHeight:1}}>{d.num}</div>
                  <div style={{fontSize:'0.58rem',marginTop:'0.2rem',opacity:0.6}}>{d.month}</div>
                </button>
              ))}
            </div>

            {selDate && (
              <>
                <div style={{fontSize:'0.68rem',fontWeight:600,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:'1rem'}}>Select Time Slot</div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(110px,1fr))',gap:'0.5rem',marginBottom:'2rem'}}>
                  {SLOTS.map(sl=>{
                    const taken = takenSlots.includes(sl);
                    return (
                      <button key={sl} disabled={taken} onClick={()=>setSelSlot(sl)}
                        style={{padding:'0.65rem',borderRadius:8,
                          border:`1px solid ${selSlot===sl?'var(--green2)':'var(--border2)'}`,
                          background:selSlot===sl?'var(--green-l)':'var(--bg2)',
                          color:selSlot===sl?'var(--green3)':taken?'var(--muted2)':'var(--white)',
                          fontSize:'0.8rem',fontWeight:500,opacity:taken?0.3:1,
                          cursor:taken?'not-allowed':'pointer',position:'relative'}}>
                        {sl}
                        {taken && <div style={{position:'absolute',top:4,right:5,width:5,height:5,borderRadius:'50%',background:'#9b4444'}}></div>}
                      </button>
                    );
                  })}
                </div>
              </>
            )}
            <div style={{display:'flex',gap:'0.75rem',justifyContent:'space-between'}}>
              <button onClick={()=>setStep(1)} style={S.outlineBtn}>← Back</button>
              {selDate&&selSlot && <button onClick={()=>setStep(3)} style={S.greenBtn}>Continue →</button>}
            </div>
          </div>
        )}

        {/* STEP 3 */}
        {step===3 && (
          <div style={{maxWidth:500}}>
            <h2 style={{fontFamily:'var(--font-d)',fontSize:'2rem',fontWeight:400,color:'var(--white)',marginBottom:'0.4rem'}}>Your <em style={{color:'var(--gold)'}}>Details</em></h2>
            <p style={{fontSize:'0.85rem',color:'var(--muted)',fontWeight:300,marginBottom:'2rem'}}>Almost done — just a few details.</p>

            {/* summary */}
            <div style={{...S.card,background:'rgba(64,145,108,0.06)',border:'1px solid rgba(64,145,108,0.2)',marginBottom:'2rem'}}>
              <div style={{fontSize:'0.65rem',fontWeight:600,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--green3)',marginBottom:'0.9rem'}}>Booking Summary</div>
              {[
                ['Service', selSvc?.name],
                ['Duration', `${selSvc?.duration} min`],
                ['Date', new Date(selDate).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})],
                ['Time', selSlot],
                ['Amount', fmt(selSvc?.price)],
              ].map(([k,v])=>(
                <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'0.45rem 0',borderBottom:'1px solid var(--border2)',fontSize:'0.85rem'}}>
                  <span style={{color:'var(--muted)',fontWeight:300}}>{k}</span>
                  <span style={{color:k==='Amount'?'var(--gold)':'var(--white)',fontFamily:k==='Amount'?'var(--font-d)':'inherit',fontSize:k==='Amount'?'1.05rem':'inherit',fontWeight:k==='Amount'?500:400}}>{v}</span>
                </div>
              ))}
            </div>

            <div style={{display:'flex',flexDirection:'column',gap:'1.1rem',marginBottom:'2rem'}}>
              {[['name','Full Name','text','Your full name'],['phone','Phone Number','tel','10-digit mobile'],['email','Email (optional)','email','For confirmation']].map(([k,l,t,ph])=>(
                <div key={k}>
                  <label style={S.label}>{l}</label>
                  <input type={t} value={form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))} placeholder={ph} style={S.input}/>
                </div>
              ))}
            </div>
            <div style={{display:'flex',gap:'0.75rem'}}>
              <button onClick={()=>setStep(2)} style={S.outlineBtn}>← Back</button>
              <button onClick={confirmBooking} style={{...S.greenBtn,flex:1,textAlign:'center',boxShadow:'0 6px 20px rgba(64,145,108,0.25)'}}>Confirm Booking →</button>
            </div>
          </div>
        )}
      </div>
      {toast && <Toast msg={toast.msg} type={toast.type}/>}
    </div>
  );

  /* ════ CONFIRMATION ════ */
  if(screen==='confirm') {
    const bk = bookings[0];
    return (
      <div style={{minHeight:'100vh',background:'var(--bg)',display:'flex',alignItems:'center',justifyContent:'center',padding:'2rem'}}>
        <div style={{...S.card,maxWidth:440,width:'100%',textAlign:'center',border:'1px solid rgba(64,145,108,0.25)'}}>
          <div style={{width:60,height:60,borderRadius:'50%',background:'rgba(64,145,108,0.15)',border:'1px solid rgba(64,145,108,0.3)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.4rem',margin:'0 auto 1.5rem',color:'var(--green3)'}}>✓</div>
          <h2 style={{fontFamily:'var(--font-d)',fontSize:'1.8rem',fontWeight:400,color:'var(--white)',marginBottom:'0.4rem'}}>
            You're <em style={{color:'var(--gold)'}}>Booked</em>
          </h2>
          <p style={{fontSize:'0.85rem',color:'var(--muted)',fontWeight:300,marginBottom:'2rem'}}>We look forward to seeing you, {bk?.name}.</p>
          <div style={{background:'var(--bg3)',borderRadius:10,padding:'1.2rem',marginBottom:'1.8rem',textAlign:'left'}}>
            {[['Service',selSvc?.name],['Date',new Date(selDate).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})],['Time',selSlot],['Amount',fmt(selSvc?.price)]].map(([k,v])=>(
              <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'0.45rem 0',borderBottom:'1px solid var(--border2)',fontSize:'0.85rem'}}>
                <span style={{color:'var(--muted)'}}>{k}</span>
                <span style={{color:k==='Amount'?'var(--gold)':'var(--white)',fontFamily:k==='Amount'?'var(--font-d)':'inherit'}}>{v}</span>
              </div>
            ))}
          </div>
          <p style={{fontSize:'0.75rem',color:'var(--muted)',marginBottom:'2rem',lineHeight:1.7}}>
            📞 For changes, call <span style={{color:'var(--white)'}}>+91 98765 43210</span><br/>
            A record has been saved for your appointment.
          </p>
          <button onClick={resetBook} style={{...S.greenBtn,width:'100%'}}>Book Another Session</button>
        </div>
      </div>
    );
  }

  /* ════ ADMIN ════ */
  if(screen==='admin') {
    /* PIN screen */
    if(!adminAuth) return (
      <div style={{minHeight:'100vh',background:'var(--bg)',display:'flex',alignItems:'center',justifyContent:'center',padding:'2rem'}}>
        <div style={{...S.card,maxWidth:360,width:'100%',border:'1px solid var(--border)'}}>
          <div style={{fontFamily:'var(--font-d)',fontSize:'1.5rem',fontWeight:400,marginBottom:'0.3rem'}}>
            <span style={{color:'var(--green3)'}}>Admin</span> <em style={{color:'var(--gold)'}}>Panel</em>
          </div>
          <p style={{fontSize:'0.78rem',color:'var(--muted)',marginBottom:'1.8rem',fontWeight:300}}>Enter your PIN to continue</p>
          <label style={S.label}>PIN</label>
          <input
            type="password"
            value={adminPin}
            onChange={e=>setAdminPin(e.target.value)}
            onKeyDown={e=>{ if(e.key==='Enter'){ if(adminPin==='1234') setAdminAuth(true); else showToast('Wrong PIN','error'); }}}
            placeholder="••••"
            style={{...S.input, marginBottom:'1rem', letterSpacing:'0.3em', fontSize:'1.2rem', textAlign:'center'}}
          />
          <button
            onClick={()=>{ if(adminPin==='1234') setAdminAuth(true); else showToast('Wrong PIN','error'); }}
            style={{...S.greenBtn, width:'100%', marginBottom:'0.75rem'}}>
            Enter →
          </button>
          <p style={{fontSize:'0.7rem',color:'var(--muted)',textAlign:'center',marginBottom:'0.75rem'}}>Demo PIN: 1234</p>
          <button onClick={()=>setScreen('home')} style={{...S.outlineBtn,width:'100%',fontSize:'0.75rem',padding:'0.6rem'}}>← Back to site</button>
        </div>
        {toast && <Toast msg={toast.msg} type={toast.type}/>} 
      </div>
    );

    /* Admin dashboard */
    return (
      <div className="admin-layout" style={{minHeight:'100vh',background:'var(--bg)',display:'flex',position:'relative'}}>
        {/* Hamburger for mobile */}
        <button className="admin-hamburger" aria-label="Open sidebar" onClick={()=>setSidebarOpen(true)} style={{display:'none',alignItems:'center',justifyContent:'center'}}>
          <span></span>
          <span></span>
          <span></span>
        </button>
        {/* Sidebar backdrop for mobile */}
        {sidebarOpen && <div className="admin-sidebar-backdrop" onClick={()=>setSidebarOpen(false)}></div>}
        {/* sidebar */}
        <aside className={"admin-sidebar" + (sidebarOpen ? " open" : "")} style={{width:220,background:'var(--bg2)',borderRight:'1px solid var(--border2)',padding:'1.4rem 1rem',flexShrink:0,display:'flex',flexDirection:'column'}}>
          <div style={{fontFamily:'var(--font-d)',fontSize:'1.2rem',fontWeight:400,marginBottom:'2.5rem',paddingLeft:'0.5rem'}}>
            <span style={{color:'var(--green3)'}}>Verdure</span> <em style={{color:'var(--gold)',fontSize:'0.95rem'}}>Admin</em>
          </div>
          {[['◈','bookings','Bookings'],['◉','overview','Overview']].map(([ic,id,l])=>{
            const active = adminView===id;
            return (
              <button key={id} onClick={()=>{setAdminView(id); setSidebarOpen(false);}}
                style={{width:'100%',display:'flex',alignItems:'center',gap:'0.75rem',padding:'0.7rem 0.9rem',borderRadius:8,marginBottom:'0.25rem',
                  background:active?'var(--green-l)':'transparent',
                  color:active?'var(--green3)':'var(--muted)',
                  fontSize:'0.82rem',fontWeight:active?600:400,textAlign:'left',
                  border:`1px solid ${active?'rgba(64,145,108,0.25)':'transparent'}`}}>
                <span style={{fontSize:'0.75rem'}}>{ic}</span>{l}
              </button>
            );
          })}
          <div style={{marginTop:'auto',display:'flex',flexDirection:'column',gap:'0.5rem'}}>
            <button onClick={()=>{setScreen('home');setAdminAuth(false);setAdminPin('');}} style={{...S.outlineBtn,width:'100%',fontSize:'0.75rem',padding:'0.6rem'}}>← Exit Admin</button>
          </div>
        </aside>

        {/* main content */}
        <main className="admin-main" style={{flex:1,overflowY:'auto',padding:'2rem',transition:'filter 0.2s',filter:sidebarOpen?'blur(2px)':'none'}}>

          {/* ── BOOKINGS VIEW ── */}
          {adminView==='bookings' && (
            <div>
              <div style={{marginBottom:'2rem'}}>
                <h1 style={{fontFamily:'var(--font-d)',fontSize:'1.8rem',fontWeight:400,color:'var(--white)'}}>
                  All <em style={{color:'var(--gold)'}}>Bookings</em>
                </h1>
                <p style={{fontSize:'0.82rem',color:'var(--muted)',fontWeight:300,marginTop:4}}>Manage and update all appointments.</p>
              </div>

              {/* stats row */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:'1rem',marginBottom:'2rem'}}>
                {[
                  {l:'Total',     v:stats.total,       c:'var(--muted)'},
                  {l:'Confirmed', v:stats.confirmed,   c:'var(--green3)'},
                  {l:'Pending',   v:stats.pending,     c:'var(--gold)'},
                  {l:'Revenue',   v:fmt(stats.revenue),c:'var(--gold)'},
                ].map(s=>(
                  <div key={s.l} style={{...S.card,borderTop:`2px solid ${s.c}`}}>
                    <div style={{fontSize:'0.65rem',fontWeight:600,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:'0.6rem'}}>{s.l}</div>
                    <div style={{fontFamily:'var(--font-d)',fontSize:'1.7rem',fontWeight:400,fontStyle:'italic',color:s.c,lineHeight:1}}>{s.v}</div>
                  </div>
                ))}
              </div>

              {/* filters */}
              <div style={{display:'flex',gap:'0.5rem',marginBottom:'1.2rem',flexWrap:'wrap'}}>
                {['All','Pending','Confirmed','Completed','Cancelled'].map(f=>(
                  <button key={f} onClick={()=>setAdminFilter(f)}
                    style={{padding:'0.38rem 1rem',borderRadius:99,
                      border:`1px solid ${adminFilter===f?'var(--green2)':'var(--border2)'}`,
                      background:adminFilter===f?'var(--green-l)':'transparent',
                      color:adminFilter===f?'var(--green3)':'var(--muted)',
                      fontSize:'0.75rem',fontWeight:500}}>
                    {f}
                  </button>
                ))}
              </div>

              {/* bookings list */}
              <div style={{display:'flex',flexDirection:'column',gap:'0.75rem'}}>
                {adminFiltered.map(b=>(
                  <div key={b.id} style={{...S.card,display:'flex',alignItems:'center',gap:'1rem',flexWrap:'wrap'}}>
                    <div style={{flex:'1 1 180px'}}>
                      <div style={{fontSize:'0.9rem',fontWeight:600,color:'var(--white)',marginBottom:2}}>{b.name}</div>
                      <div style={{fontSize:'0.75rem',color:'var(--muted)',fontWeight:300}}>{b.phone}</div>
                    </div>
                    <div style={{flex:'1 1 160px'}}>
                      <div style={{fontFamily:'var(--font-d)',fontSize:'0.95rem',color:'var(--green3)'}}>{b.service}</div>
                      <div style={{fontSize:'0.75rem',color:'var(--muted)',fontWeight:300}}>{new Date(b.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'})} · {b.slot}</div>
                    </div>
                    <div><Badge status={b.status}/></div>
                    <div style={{fontFamily:'var(--font-d)',fontSize:'1rem',color:'var(--gold)',minWidth:70,textAlign:'right'}}>{fmt(b.price)}</div>
                    <div style={{display:'flex',gap:'0.4rem',flexShrink:0}}>
                      {b.status==='Pending'   && <button onClick={()=>confirmBk(b.id)}  style={{padding:'0.35rem 0.8rem',borderRadius:6,background:'rgba(64,145,108,0.15)',color:'var(--green3)',fontSize:'0.72rem',fontWeight:600,border:'1px solid rgba(64,145,108,0.25)'}}>Confirm</button>}
                      {b.status==='Confirmed' && <button onClick={()=>completeBk(b.id)} style={{padding:'0.35rem 0.8rem',borderRadius:6,background:'var(--bg3)',color:'var(--muted)',fontSize:'0.72rem',fontWeight:600,border:'1px solid var(--border2)'}}>Done</button>}
                      {(b.status==='Pending'||b.status==='Confirmed') && <button onClick={()=>cancelBooking(b.id)} style={{padding:'0.35rem 0.8rem',borderRadius:6,background:'rgba(140,60,60,0.12)',color:'#d47a7a',fontSize:'0.72rem',fontWeight:600,border:'1px solid rgba(140,60,60,0.2)'}}>Cancel</button>}
                    </div>
                  </div>
                ))}
                {adminFiltered.length===0 && <div style={{textAlign:'center',padding:'3rem',color:'var(--muted)',fontSize:'0.9rem',fontWeight:300}}>No bookings found.</div>}
              </div>
            </div>
          )}

          {/* ── OVERVIEW VIEW ── */}
          {adminView==='overview' && (
            <div>
              <div style={{marginBottom:'2rem'}}>
                <h1 style={{fontFamily:'var(--font-d)',fontSize:'1.8rem',fontWeight:400,color:'var(--white)'}}>
                  Business <em style={{color:'var(--gold)'}}>Overview</em>
                </h1>
                <p style={{fontSize:'0.82rem',color:'var(--muted)',fontWeight:300,marginTop:4}}>Analytics and performance at a glance.</p>
              </div>

              {/* big stat cards */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:'1rem',marginBottom:'1.5rem'}}>
                {[
                  {l:'Total Bookings',  v:stats.total,                                                              c:'var(--muted)',   note:'All time'},
                  {l:'Confirmed',       v:stats.confirmed,                                                          c:'var(--green3)', note:`${stats.total?Math.round((stats.confirmed/stats.total)*100):0}% of total`},
                  {l:'Pending Review',  v:stats.pending,                                                            c:'var(--gold)',    note:'Awaiting action'},
                  {l:'Total Revenue',   v:fmt(stats.revenue),                                                       c:'var(--gold)',    note:'Confirmed + Completed'},
                  {l:'Avg Booking Val', v:fmt(stats.total?Math.round(bookings.reduce((a,b)=>a+b.price,0)/stats.total):0), c:'var(--green3)', note:'Per appointment'},
                  {l:'Cancellations',   v:bookings.filter(b=>b.status==='Cancelled').length,                        c:'#d47a7a',       note:`${stats.total?Math.round((bookings.filter(b=>b.status==='Cancelled').length/stats.total)*100):0}% rate`},
                ].map(s=>(
                  <div key={s.l} style={{...S.card,borderTop:`2px solid ${s.c}`}}>
                    <div style={{fontSize:'0.62rem',fontWeight:600,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:'0.6rem'}}>{s.l}</div>
                    <div style={{fontFamily:'var(--font-d)',fontSize:'1.6rem',fontWeight:400,fontStyle:'italic',color:s.c,lineHeight:1,marginBottom:'0.35rem'}}>{s.v}</div>
                    <div style={{fontSize:'0.7rem',color:'var(--muted2)',fontWeight:300}}>{s.note}</div>
                  </div>
                ))}
              </div>

              {/* services breakdown */}
              <div style={{...S.card,marginBottom:'1.2rem'}}>
                <div style={{fontSize:'0.68rem',fontWeight:600,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:'1.2rem'}}>Revenue by Service</div>
                {(()=>{
                  const svc={};
                  bookings.forEach(b=>{ if(!svc[b.service]) svc[b.service]={count:0,revenue:0}; svc[b.service].count++; if(b.status==='Confirmed'||b.status==='Completed') svc[b.service].revenue+=b.price; });
                  const sorted = Object.entries(svc).sort((a,b)=>b[1].revenue-a[1].revenue);
                  const maxRev = sorted[0]?.[1].revenue||1;
                  return sorted.map(([name,d])=>(
                    <div key={name} style={{display:'flex',alignItems:'center',gap:'1rem',padding:'0.7rem 0',borderBottom:'1px solid var(--border2)'}}>
                      <div style={{width:140,fontSize:'0.82rem',fontWeight:500,color:'var(--white)',flexShrink:0}}>{name}</div>
                      <div style={{flex:1,height:6,background:'var(--bg3)',borderRadius:99,overflow:'hidden'}}>
                        <div style={{height:'100%',background:'linear-gradient(90deg,var(--green),var(--green3))',borderRadius:99,width:`${(d.revenue/maxRev)*100}%`,transition:'width 0.4s'}}></div>
                      </div>
                      <div style={{fontSize:'0.75rem',color:'var(--muted)',width:40,textAlign:'right',flexShrink:0}}>{d.count}x</div>
                      <div style={{fontFamily:'var(--font-d)',fontSize:'0.9rem',color:'var(--gold)',width:70,textAlign:'right',flexShrink:0}}>{fmt(d.revenue)}</div>
                    </div>
                  ));
                })()}
              </div>

              {/* status pie — visual bars */}
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1.2rem'}}>
                <div style={{...S.card}}>
                  <div style={{fontSize:'0.68rem',fontWeight:600,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:'1.2rem'}}>Status Breakdown</div>
                  {[
                    {l:'Confirmed', v:stats.confirmed,                                    c:'var(--green3)'},
                    {l:'Pending',   v:stats.pending,                                      c:'var(--gold)'},
                    {l:'Completed', v:bookings.filter(b=>b.status==='Completed').length,  c:'var(--muted)'},
                    {l:'Cancelled', v:bookings.filter(b=>b.status==='Cancelled').length,  c:'#d47a7a'},
                  ].map(s=>(
                    <div key={s.l} style={{marginBottom:'0.9rem'}}>
                      <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.3rem'}}>
                        <span style={{fontSize:'0.78rem',color:'var(--white2)',fontWeight:400}}>{s.l}</span>
                        <span style={{fontSize:'0.78rem',color:s.c,fontWeight:600}}>{s.v}</span>
                      </div>
                      <div style={{height:5,background:'var(--bg3)',borderRadius:99,overflow:'hidden'}}>
                        <div style={{height:'100%',background:s.c,borderRadius:99,width:`${stats.total?Math.round((s.v/stats.total)*100):0}%`,opacity:0.85}}></div>
                      </div>
                    </div>
                  ))}
                </div>

                <div style={{...S.card}}>
                  <div style={{fontSize:'0.68rem',fontWeight:600,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:'1.2rem'}}>Recent Activity</div>
                  {bookings.slice(0,5).map(b=>(
                    <div key={b.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0.5rem 0',borderBottom:'1px solid var(--border2)'}}>
                      <div>
                        <div style={{fontSize:'0.8rem',fontWeight:500,color:'var(--white)'}}>{b.name}</div>
                        <div style={{fontSize:'0.7rem',color:'var(--muted)',fontWeight:300}}>{b.service}</div>
                      </div>
                      <Badge status={b.status}/>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

        </main>
        {toast && <Toast msg={toast.msg} type={toast.type}/>}
      </div>
    );
  }

  return null;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
